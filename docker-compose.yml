name: barbeariasaas

services:
  postgres:
    image: postgres:16
    container_name: barbershop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: barbeariadoblack_db
    ports:
      - "6543:5432"
    volumes:
      - pgdata_external:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barbeariadoblack_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_external:
