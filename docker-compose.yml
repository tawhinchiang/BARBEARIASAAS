name: barbeariasaas  # fixa o prefixo do compose p/ não trocar o nome dos volumes

services:
  postgres:
    image: postgres:16
    container_name: barbershop_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: barbershop_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata_external:/var/lib/postgresql/data
    healthcheck:
      # se quiser, pode checar só a instância; mas se já existir o DB, essa linha está ok:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barbershop_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_external:
    external: true
    name: barbeariasaas_barbershop_pgdata   
