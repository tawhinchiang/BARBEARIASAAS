<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Northwind Barber — Gestão</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root{
      --rail1:#1430C8;--rail2:#2943F0;--primary:#2943F0;--primary-soft:rgba(41,67,240,.18);
      --sun:#F7D85A;--sun2:#FBE9A0;--navy1:#0B1452;--navy2:#16216E;
      --ink:#F5F7FF;--muted:#9AA3B2;--bg:#0B0D12;--sidebar:#10131A;--card:#151926;--border:#242B3D;--border-hover:#2E3750;
      --teal:#19A285;--orange:#EE7B48;--gold:#D69D13;--red:#E5484D;--deep:#0A1026;
    }
    html,body,#root{height:100%} body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",Inter,system-ui,sans-serif}
    *{box-sizing:border-box}
    .tabnums{font-variant-numeric:tabular-nums}
    .card{background:var(--card);border:1px solid var(--border);border-radius:20px;box-shadow:0 8px 24px rgba(0,0,0,.35);padding:20px;transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
    .card:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(0,0,0,.42);border-color:var(--border-hover)}
    .nohover:hover{transform:none}
    .btn{border-radius:12px;padding:10px 14px;font-weight:700}
    .fade-slide{animation:fadeSlide .2s ease}
    @keyframes fadeSlide{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media (prefers-reduced-motion: reduce){.fade-slide{animation:none}.card,.card:hover{transition:none;transform:none}}
    ::-webkit-scrollbar{width:10px;height:10px} ::-webkit-scrollbar-thumb{background:#2b3348;border-radius:999px}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef} = React;

const fmtBRL = (v)=> new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(Number(v||0));
const statusMeta = {
  confirmed:{l:'Confirmado',c:'var(--primary)'}, in_progress:{l:'Em atendimento',c:'var(--orange)'},
  completed:{l:'Concluído',c:'var(--teal)'}, cancelled:{l:'Cancelado',c:'var(--red)'},
  no_show:{l:'Não compareceu',c:'#94a3b8'}, pending:{l:'Pendente',c:'var(--gold)'}, blocked:{l:'Bloqueado',c:'#64748b'}
};

const areas = [
  {id:'agenda',label:'Agenda',sub:'Visão geral e agendamentos',cta:'Novo agendamento',
   icon:(p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>},
  {id:'profissionais',label:'Profissionais',sub:'Equipe e disponibilidade',cta:'Adicionar',
   icon:(p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/></svg>},
  {id:'servicos',label:'Serviços',sub:'Catálogo e preços',cta:'Novo serviço',
   icon:(p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M6 3v7a6 6 0 0 0 6 6 6 6 0 0 0 6-6V3"/><path d="M4 3h4M16 3h4M12 16v5"/></svg>},
  {id:'faturamento',label:'Faturamento',sub:'Receita e desempenho',cta:'Exportar',
   icon:(p)=><svg {...p} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>},
];

function useCount(to,d=600){const [v,setV]=useState(0); useEffect(()=>{let s=null; const n=Number(to||0); const step=(t)=>{if(!s)s=t; const p=Math.min((t-s)/d,1); setV(n*(1-Math.pow(1-p,3))); if(p<1)requestAnimationFrame(step)}; const r=requestAnimationFrame(step); return()=>cancelAnimationFrame(r)},[to,d]); return v;}
function Spark({color='#2943F0',down}){const pts=down?'0,18 10,14 20,16 30,10 40,12 50,6 60,8':'0,16 10,12 20,14 30,8 40,10 50,4 60,6'; return <svg width="64" height="24"><polyline points={pts} fill="none" stroke={color} strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"/></svg>}
function Avatar({name,size=28,src}){if(src) return <img src={src} alt={name} style={{width:size,height:size,borderRadius:999,objectFit:'cover',flex:'0 0 auto'}}/>; const hue=(String(name||'?').split('').reduce((a,c)=>a+c.charCodeAt(0),0)%360); return <div style={{width:size,height:size,borderRadius:999,background:`hsl(${hue} 55% 45%)`,display:'grid',placeItems:'center',fontSize:size*0.38,fontWeight:800,color:'#fff',flex:'0 0 auto'}}>{String(name||'?').split(' ').map(x=>x[0]).slice(0,2).join('')}</div>}

function App(){
  const [area,setArea]=useState('agenda');
  const [summary,setSummary]=useState(null);
  const [barbers,setBarbers]=useState([]);
  const [services,setServices]=useState([]);
  const [err,setErr]=useState('');
  const load = async ()=>{
    try{
      setErr('');
      const [s,b,sv] = await Promise.all([
        fetch('/api/dashboard-summary').then(r=>r.json()),
        fetch('/api/barbers').then(r=>r.json()),
        fetch('/api/services').then(r=>r.json())
      ]);
      setSummary(s); setBarbers(b.barbers||[]); setServices(sv.services||[]);
    }catch(e){ setErr('Não foi possível carregar os dados. Verifique se o servidor está ativo.'); }
  };
  useEffect(()=>{ load(); },[]);
  const active=areas.find(a=>a.id===area);
  return (
    <div className="h-full w-full p-4 md:p-6" style={{background:'#05070B'}}>
      <div className="mx-auto h-full max-w-[1440px] overflow-hidden rounded-[24px] border" style={{borderColor:'#1d2230',display:'grid',gridTemplateColumns:'72px 220px 1fr',background:'var(--bg)'}}>
        <aside style={{background:'linear-gradient(180deg,var(--rail1),var(--rail2))'}} className="flex flex-col items-center py-4">
          <div className="mb-6 grid h-10 w-10 place-items-center rounded-xl text-lg font-extrabold" style={{background:'var(--sun)',color:'#14182B'}}>NB</div>
          <div className="flex flex-col gap-2">
            {areas.map(a=>{const I=a.icon; const on=a.id===area; return (
              <button key={a.id} onClick={()=>setArea(a.id)} className="relative grid h-11 w-11 place-items-center rounded-xl" style={{background:on?'rgba(255,255,255,.15)':'transparent',color:'#fff'}} title={a.label}>
                {on && <span className="absolute left-0 h-5 w-[3px] rounded-r" style={{background:'var(--sun)'}}/>}
                <I className="h-5 w-5"/>
              </button>)})}
          </div>
          <div className="mt-auto flex flex-col items-center gap-3 text-white/90">
            <div className="grid h-10 w-10 place-items-center rounded-xl">⚙</div>
            <div className="relative"><Avatar name="Admin" size={34}/><span className="absolute bottom-0 right-0 h-2.5 w-2.5 rounded-full border-2 border-[#1430C8]" style={{background:'#19A285'}}/></div>
          </div>
        </aside>
        <aside style={{background:'var(--sidebar)',borderRight:'1px solid var(--border)'}} className="flex flex-col p-4 overflow-auto">
          <div className="card nohover mb-4 flex items-center gap-3 !p-3">
            <div className="grid h-9 w-9 place-items-center rounded-lg font-extrabold" style={{background:'var(--sun)',color:'#14182B'}}>NB</div>
            <div className="min-w-0"><div className="truncate text-sm font-bold">Northwind Barber</div><div className="text-xs" style={{color:'var(--muted)'}}>Gestão de barbearia</div></div>
          </div>
          <div className="mb-2 text-[10px] font-bold tracking-[.14em]" style={{color:'var(--muted)'}}>ÁREA</div>
          <div className="text-[22px] font-extrabold leading-tight">{active.label}</div>
          <div className="mb-4 text-sm" style={{color:'var(--muted)'}}>{active.sub}</div>
          <nav className="space-y-1">
            {(area==='agenda'?['Visão geral','Agendamentos','Bloqueios','Histórico']:area==='profissionais'?['Equipe','Disponibilidade','Desempenho']:area==='servicos'?['Catálogo','Preços','Destaques']:['Resumo','Receita','Status','Relatórios']).map((n,i)=>(
              <div key={n} className="flex items-center rounded-xl px-3 py-2 text-sm font-semibold" style={i===0?{background:'var(--primary-soft)',color:'var(--primary)'}:{color:'var(--ink)'}}>
                <span>{n}</span><span className="ml-auto text-xs" style={{color:i===0?'var(--primary)':'var(--muted)'}}>
                  {i===0 && area==='agenda' && summary ? summary.kpis.todayAppointments : i===0 && area==='profissionais' ? barbers.length : i===0 && area==='servicos' ? services.length : ''}
                </span>
              </div>
            ))}
          </nav>
          <div className="mt-auto pt-4">
            <div className="rounded-[20px] p-4" style={{background:'linear-gradient(180deg,var(--sun),var(--sun2))',color:'#14182B'}}>
              <div className="text-sm font-extrabold">Demo de portfólio</div>
              <div className="mt-1 text-xs">Dados carregados da API local (SQLite). Agenda, profissionais, serviços e faturamento.</div>
              <button onClick={load} className="mt-3 rounded-xl bg-[#14182B] px-3 py-1.5 text-xs font-bold text-white">Atualizar dados</button>
            </div>
          </div>
        </aside>
        <main className="overflow-auto p-5 md:p-6">
          <div className="mb-5 flex flex-wrap items-center gap-3">
            <div><div className="text-[11px]" style={{color:'var(--muted)'}}>Northwind Barber &gt; {active.label} &gt; Visão geral</div><div className="text-[24px] font-extrabold">{active.label}</div></div>
            <div className="ml-auto flex flex-wrap items-center gap-2">
              <div className="rounded-xl border px-3 py-2 text-sm" style={{borderColor:'var(--border)',background:'var(--card)',color:'var(--muted)'}}>Buscar cliente, serviço… <span className="ml-3 rounded-md border px-1.5 py-0.5 text-[10px]" style={{borderColor:'var(--border)'}}>⌘K</span></div>
              <div className="rounded-full border px-3 py-2 text-sm" style={{borderColor:'var(--border)',background:'var(--card)'}}><span style={{color:'#19A285'}}>●</span> {summary?.today || 'Hoje'}</div>
              <button onClick={load} className="btn text-white" style={{background:'var(--primary)'}}>{active.cta}</button>
            </div>
          </div>
          {err && <div className="mb-4 rounded-xl border p-3 text-sm" style={{borderColor:'rgba(229,72,77,.4)',background:'rgba(229,72,77,.1)',color:'#ff8086'}}>{err}</div>}
          <div key={area} className="fade-slide">
            {area==='agenda' && <Agenda summary={summary} barbers={barbers} services={services}/>}
            {area==='profissionais' && <Profissionais barbers={barbers}/>}
            {area==='servicos' && <Servicos services={services}/>}
            {area==='faturamento' && <Faturamento summary={summary}/>}
          </div>
        </main>
      </div>
    </div>
  );
}

function KPI({title,value,money,note,delta,sun,down}){
  const v=useCount(money?0:value); const disp = money ? fmtBRL(value) : Math.round(v);
  return (
    <div className="card" style={sun?{background:'linear-gradient(180deg,var(--sun),var(--sun2))',color:'#14182B',borderColor:'transparent'}:{}}>
      <div className="flex items-start justify-between"><div className="text-sm font-semibold" style={sun?{}:{color:'var(--muted)'}}>{title}</div><div className="rounded-full px-2 py-0.5 text-xs font-bold" style={sun?{background:'#14182B',color:'#fff'}:{background:down?'rgba(229,72,77,.15)':'rgba(25,162,133,.15)',color:down?'#ff8086':'#4fe0c2'}}>{delta}</div></div>
      <div className="mt-2 flex items-end justify-between"><div><div className="tabnums text-[30px] font-extrabold leading-none">{disp}</div><div className="mt-1 text-xs" style={sun?{color:'rgba(20,24,43,.7)'}:{color:'var(--muted)'}}>{note}</div></div><Spark color={sun?'#14182B':'#2943F0'} down={down}/></div>
    </div>
  );
}

function Agenda({summary,barbers,services}){
  const k=summary?.kpis||{}; const recent=summary?.recent||[];
  return (<div className="space-y-4">
    <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
      <KPI sun title="Agendamentos hoje" value={k.todayAppointments||0} delta="ao vivo" note="Agenda do dia"/>
      <KPI title="Profissionais ativos" value={k.activeBarbers||barbers.length} delta={`${barbers.length}`} note="Equipe disponível"/>
      <KPI title="Serviços ativos" value={k.activeServices||services.length} delta={`${services.length}`} note="Catálogo"/>
      <KPI title="Receita do mês" value={k.monthRevenue||0} money delta="mês" note={`${k.monthAppointments||0} agendamentos no mês`}/>
    </div>
    <div className="grid gap-4 xl:grid-cols-[2fr_1fr]">
      <div className="card nohover overflow-hidden !p-0" style={{background:`radial-gradient(circle at 20% 20%, rgba(41,67,240,.35), transparent 35%), linear-gradient(180deg,var(--navy1),var(--navy2))`,borderColor:'rgba(255,255,255,.06)'}}>
        <div className="flex items-center gap-2 p-5 pb-2"><div className="text-xs font-bold tracking-wide" style={{color:'var(--sun)'}}>● VISÃO DA AGENDA</div><div className="ml-auto text-xs text-white/70">Gestão de barbearia</div></div>
        <AgendaCanvas barbers={barbers}/>
        <div className="border-t border-white/10 px-5 py-3 text-xs text-white/80">Resumo operacional com dados reais da API · tema escuro (preto principal)</div>
      </div>
      <div className="card">
        <div className="mb-3"><div className="text-sm font-bold">Agendamentos recentes</div><div className="text-xs" style={{color:'var(--muted)'}}>Últimas movimentações</div></div>
        <div className="space-y-2">
          {recent.length? recent.map(a=>{const st=statusMeta[a.status]||{l:a.status,c:'var(--muted)'}; return (
            <div key={a.id} className="flex items-center gap-2 rounded-xl border p-2.5" style={{borderColor:'var(--border)'}}>
              <Avatar name={a.client}/><div className="min-w-0"><div className="truncate text-sm font-semibold">{a.client}</div><div className="truncate text-xs" style={{color:'var(--muted)'}}>{a.service} · {a.barber} · {a.time||'--:--'}</div></div>
              <span className="ml-auto rounded-full px-2 py-1 text-[10px] font-bold whitespace-nowrap" style={{background:`color-mix(in srgb, ${st.c} 18%, transparent)`,color:st.c}}>{st.l}</span>
            </div>
          )}) : <div className="text-sm" style={{color:'var(--muted)'}}>Sem agendamentos ainda. Use o fluxo de agendamento da API ou crie dados no sistema.</div>}
        </div>
      </div>
    </div>
  </div>);
}

function AgendaCanvas({barbers}){
  const ref=useRef(null);
  useEffect(()=>{const c=ref.current; if(!c) return; const x=c.getContext('2d'); let raf,t=0; const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
    const fit=()=>{const d=devicePixelRatio||1,r=c.getBoundingClientRect(); c.width=r.width*d; c.height=r.height*d}; fit(); const ro=new ResizeObserver(fit); ro.observe(c);
    const draw=()=>{if(!reduce) t+=0.01; const d=devicePixelRatio||1,w=c.width/d,h=c.height/d; x.setTransform(d,0,0,d,0,0); x.clearRect(0,0,w,h);
      const cols=Math.max(3,Math.min(6,barbers.length||4)), rows=6, pad=28, gw=w-pad*2, gh=h-pad*2, cw=gw/cols, rh=gh/rows;
      x.strokeStyle='rgba(255,255,255,.06)'; for(let i=0;i<=cols;i++){x.beginPath();x.moveTo(pad+i*cw,pad);x.lineTo(pad+i*cw,pad+gh);x.stroke()} for(let j=0;j<=rows;j++){x.beginPath();x.moveTo(pad,pad+j*rh);x.lineTo(pad+gw,pad+j*rh);x.stroke()}
      const labels=(barbers.length?barbers.map(b=>b.name.split(' ')[0]):['Equipe','Agenda','Serviços','Receita']).slice(0,cols);
      x.fillStyle='rgba(255,255,255,.7)'; x.font='700 10px Plus Jakarta Sans'; x.textAlign='center'; labels.forEach((l,i)=>x.fillText(l,pad+i*cw+cw/2,pad-10));
      for(let i=0;i<cols;i++){const n=2+(i%3); for(let k=0;k<n;k++){const r=(i*3+k)%rows; const pulse=.85+.15*Math.sin(t+i+k); const col=['rgba(41,67,240,.55)','rgba(25,162,133,.5)','rgba(247,216,90,.45)','rgba(238,123,72,.45)'][(i+k)%4]; x.fillStyle=col; const rx=pad+i*cw+6, ry=pad+r*rh+6, rw=cw-12, rhh=rh*pulse-12; if(rhh>4){const rr=8; x.beginPath(); x.moveTo(rx+rr,ry); x.arcTo(rx+rw,ry,rx+rw,ry+rhh,rr); x.arcTo(rx+rw,ry+rhh,rx,ry+rhh,rr); x.arcTo(rx,ry+rhh,rx,ry,rr); x.arcTo(rx,ry,rx+rw,ry,rr); x.fill();}}
      }
      raf=requestAnimationFrame(draw)}; draw(); return()=>{cancelAnimationFrame(raf); ro.disconnect()};
  },[barbers]);
  return <canvas ref={ref} style={{width:'100%',height:280,display:'block'}}/>;
}

function Profissionais({barbers}){
  return (<div className="space-y-4">
    <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
      {barbers.length? barbers.map(b=>(
        <div key={b.id} className="card">
          <div className="flex items-center gap-3"><Avatar name={b.name} src={b.photo} size={46}/><div><div className="text-sm font-extrabold">{b.name}</div><div className="text-xs" style={{color:'var(--muted)'}}>{Array.isArray(b.specialties)?b.specialties.join(', '):b.specialties}</div></div><span className="ml-auto rounded-full px-2 py-1 text-[10px] font-bold" style={{background:'rgba(25,162,133,.15)',color:'#4fe0c2'}}>Ativo</span></div>
          <div className="mt-4 rounded-xl border p-3 text-xs" style={{borderColor:'var(--border)',color:'var(--muted)'}}>Disponibilidade configurada no sistema · pronto para agendamentos.</div>
          <div className="mt-3 flex gap-2"><button className="btn !py-2 !text-xs text-white" style={{background:'var(--primary-soft)',color:'var(--primary)'}}>Ver agenda</button><button className="btn !py-2 !text-xs border" style={{borderColor:'var(--border)',color:'var(--ink)'}}>Editar</button></div>
        </div>
      )) : <div className="card text-sm" style={{color:'var(--muted)'}}>Nenhum profissional encontrado.</div>}
    </div>
  </div>);
}

function Servicos({services}){
  const max=Math.max(1,...services.map(s=>Number(s.price||0)));
  return (<div className="space-y-4">
    <div className="grid gap-4 xl:grid-cols-[1.3fr_.7fr]">
      <div className="card"><div className="mb-3"><div className="text-sm font-bold">Catálogo de serviços</div><div className="text-xs" style={{color:'var(--muted)'}}>Preços e duração</div></div>
        <div className="space-y-2">{services.map(s=>(
          <div key={s.id} className="flex items-center gap-3 rounded-xl border p-3" style={{borderColor:'var(--border)'}}>
            <div className="grid h-10 w-10 place-items-center rounded-xl text-sm font-extrabold" style={{background:'var(--primary-soft)',color:'var(--primary)'}}>✂</div>
            <div className="min-w-0"><div className="truncate text-sm font-semibold">{s.name}</div><div className="text-xs" style={{color:'var(--muted)'}}>{s.description||'Serviço'} · {s.duration} min</div></div>
            <div className="ml-auto tabnums text-sm font-extrabold" style={{color:'var(--sun)'}}>{fmtBRL(s.price)}</div>
          </div>
        ))}{!services.length && <div className="text-sm" style={{color:'var(--muted)'}}>Nenhum serviço encontrado.</div>}</div>
      </div>
      <div className="card"><div className="mb-3"><div className="text-sm font-bold">Faixa de preços</div><div className="text-xs" style={{color:'var(--muted)'}}>Comparativo visual</div></div>
        <div className="space-y-3">{services.map((s,i)=>(
          <div key={s.id}><div className="mb-1 flex text-xs"><span className="truncate">{s.name}</span><span className="ml-auto tabnums" style={{color:'var(--muted)'}}>{fmtBRL(s.price)}</span></div><div className="h-2 rounded-full bg-white/10"><div className="h-2 rounded-full" style={{width:`${(Number(s.price||0)/max)*100}%`,background:['var(--primary)','var(--teal)','var(--sun)','var(--orange)'][i%4]}}/></div></div>
        ))}</div>
      </div>
    </div>
  </div>);
}

function Faturamento({summary}){
  const k=summary?.kpis||{}; const counts=summary?.statusCounts||{};
  const items=[['Concluídos','completed','var(--teal)'],['Confirmados','confirmed','var(--primary)'],['Em atendimento','in_progress','var(--orange)'],['Pendentes','pending','var(--gold)'],['Cancelados','cancelled','var(--red)']];
  const total=Math.max(1,Object.values(counts).reduce((a,b)=>a+Number(b||0),0));
  return (<div className="space-y-4">
    <div className="grid gap-4 md:grid-cols-2 xl:grid-cols-4">
      <KPI sun title="Receita do mês" value={k.monthRevenue||0} money delta="mês" note="Agendamentos concluídos"/>
      <KPI title="Agendamentos no mês" value={k.monthAppointments||0} delta="total" note="Todas as situações"/>
      <KPI title="Hoje" value={k.todayAppointments||0} delta="dia" note="Agendamentos do dia"/>
      <KPI title="Ticket médio (est.)" value={(k.monthAppointments? (k.monthRevenue/k.monthAppointments):0)} money delta="est." note="Receita / agendamentos"/>
    </div>
    <div className="grid gap-4 xl:grid-cols-[1fr_1fr]">
      <div className="card"><div className="text-sm font-bold">Status no mês</div><div className="text-xs" style={{color:'var(--muted)'}}>Distribuição de agendamentos</div>
        <div className="mt-4 space-y-3">{items.map(([l,key,c])=>{const v=Number(counts[key]||0); return (
          <div key={key}><div className="mb-1 flex text-xs"><span>{l}</span><span className="ml-auto tabnums font-bold">{v}</span></div><div className="h-2 rounded-full bg-white/10"><div className="h-2 rounded-full" style={{width:`${(v/total)*100}%`,background:c}}/></div></div>
        )})}</div>
      </div>
      <div className="card nohover overflow-hidden" style={{background:`radial-gradient(circle at 20% 20%, rgba(25,162,133,.18), transparent 35%), linear-gradient(180deg,var(--navy1),var(--navy2))`,borderColor:'rgba(255,255,255,.06)'}}>
        <div className="text-sm font-extrabold">Resumo financeiro</div><div className="mt-1 text-xs text-white/70">Baseado nos agendamentos concluídos do mês</div>
        <div className="mt-6 rounded-2xl border border-white/10 bg-white/5 p-4">
          <div className="text-xs text-white/70">Receita do mês</div>
          <div className="tabnums mt-1 text-3xl font-extrabold" style={{color:'var(--sun)'}}>{fmtBRL(k.monthRevenue||0)}</div>
          <div className="mt-4 grid grid-cols-2 gap-2 text-xs">{[['Profissionais',k.activeBarbers||0],['Serviços',k.activeServices||0],['Agend. mês',k.monthAppointments||0],['Agend. hoje',k.todayAppointments||0]].map(([l,v])=><div key={l} className="rounded-xl bg-white/5 p-3"><div className="text-white/60">{l}</div><div className="tabnums mt-1 text-lg font-extrabold">{v}</div></div>)}</div>
        </div>
      </div>
    </div>
  </div>);
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
