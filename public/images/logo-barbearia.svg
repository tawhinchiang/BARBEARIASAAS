<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" role="img" aria-label="Logo Barbearia">
  <defs>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1430C8"/>
      <stop offset="1" stop-color="#2943F0"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7D85A"/>
      <stop offset="1" stop-color="#FBE9A0"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="320" height="96" rx="20" fill="#0B0D12"/>
  <rect x="16" y="16" width="64" height="64" rx="16" fill="url(#rail)"/>
  <g filter="url(#glow)">
    <path d="M36 36 L48 48 L36 60" fill="none" stroke="url(#sun)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M60 36 L48 48 L60 60" fill="none" stroke="#F5F7FF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="48" cy="48" r="3.2" fill="url(#sun)"/>
  </g>
  <text x="96" y="46" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#F5F7FF">Barbearia</text>
  <text x="96" y="68" font-family="Plus Jakarta Sans, Inter, Arial, sans-serif" font-size="13" font-weight="600" fill="#9AA3B2">Gestão e agendamento</text>
  <circle cx="292" cy="48" r="6" fill="url(#sun)" opacity="0.95"/>
</svg>